name: MUSHII tests

on:
  push:
    branches:
      - main
      - feature/kern-mushii-research-engine
      - feature/mushii-lifeos-bilingual-upgrade
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check lib/life-os.js && node --check plugins/lifeos.js && node --check tests/life-os.test.js
      - name: Run test suite
        run: npm test
